</style><main><div class="badge">Estudio de vestuario · Colección ampliada</div><h1>El armario de Ciempi</h1><p class="lead">Combina tus prendas favoritas, cambia sus colores y dale una expresión.</p><div class="layout"><section class="stage" aria-label="Vista del personaje"><div id="personaje"></div><p id="descripcion" aria-live="polite"></p><div class="actions"><button id="reiniciar" type="button">Volver al conjunto original</button><button id="mezclar" type="button" hidden>Volver a mezclar zapatos</button></div><label for="conjuntos">Ideas de conjuntos</label><select id="conjuntos"><option value="">Elige una idea</option></select></section><section aria-label="Personalización"><nav id="categorias" class="tabs" aria-label="Categorías del armario"></nav><fieldset><legend id="titulo-categoria">Gorros</legend><div id="opciones" class="options"></div></fieldset><p class="count" id="cantidad"></p></section></div><p class="note">Todas las prendas son para todos. Vista de diseño: estas elecciones no compran objetos ni cambian tu inventario. <a href="coleccion-ampliada.png">Ver nueve conjuntos</a>.</p></main><script>// Piezas de exploración, ajustadas al SVG aprobado. IDs iguales al catálogo real.

// Reemplazo de un grupo por ID respetando los grupos SVG anidados.
function replaceGroup(svg,id,replacement) {
 const start=svg.indexOf(`<g id="${id}"`)
 if(start<0) throw new Error(`Falta el grupo ${id}`)
 const tags=/<\/?g\b[^>]*>/g; tags.lastIndex=start
 let depth=0,m
 while((m=tags.exec(svg))) {
  depth+=m[0].startsWith('</')?-1:1
  if(depth===0)return svg.slice(0,start)+replacement+svg.slice(tags.lastIndex)
 }
 throw new Error(`Grupo sin cierre: ${id}`)
}
function compose(base, selection) {
 const hat=gorros.find(i=>i.id===selection.cabeza)||gorros[1]
 const face=caras.find(i=>i.id===selection.cara)||caras[0]
 const shoes=zapatos.find(i=>i.id===selection.pies)||zapatos[0]
 const bag=mochilas.find(i=>i.id===selection.espalda)||mochilas[0]
 let svg=base
 const palette=paletas.find(i=>i.id===selection.paleta)||paletas[0]
 const colorMap=new Map(paletas[0].colors.map((color,i)=>[color,palette.colors[i]]))
 svg=svg.replace(/#[0-9a-fA-F]{6}/g,c=>colorMap.get(c)||c)
 if(palette.id!=='clasica')svg=svg.replaceAll('#e8752b',palette.colors[2])
 const pattern=patternSvg(selection.textura)
 if(pattern)svg=svg.replace(/(<g clip-path="url\(#clip-[^)]*\)">)/g,`$1${pattern}`)
 if(selection.expresion&&selection.expresion!=='alegre'||selection.ojos&&selection.ojos!=='oscuro')svg=replaceGroup(svg,'eyes',eyesSvg(selection.expresion||'alegre',(ojosColores.find(i=>i.id===selection.ojos)||ojosColores[0]).color,palette.colors[1]))
 if(selection.boca&&selection.boca!=='sonrisa')svg=replaceGroup(svg,'mouth',mouthSvg(selection.boca))
 if(hat.svg!==null)svg=replaceGroup(svg,'jockey',`<g id="jockey">${hat.svg}</g>`)
 // Antenas detrás del gorro: se conservan, excepto dentro del casco cerrado.
 const match=svg.match(/<g id="antennae"[\s\S]*?<\/g>/)
 if(match){svg=replaceGroup(svg,'antennae',''); if(hat.antenna!==false){const antenna=match[0].replace('M649 220','M649 275').replace('M780 208','M780 265');svg=svg.replace('<g id="head"',`${antenna}<g id="head"`)}}
 if(shoes.svg!==null||shoes.random){
  const choices=zapatos.filter(i=>!i.random)
  let seed=(Number(selection.seed)||1)>>>0
  for(let i=choices.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[choices[i],choices[j]]=[choices[j],choices[i]]}
  let foot=0
  svg=svg.replace(/(<g transform="rotate\([^"]* -10 -32\)">)[\s\S]*?<\/g>/g,(full,opening)=>{const piece=shoes.random?choices[foot++%choices.length]:shoes;return piece.svg===null?full:opening+piece.svg+'</g>'})
 }
 const clothing=ropas.find(i=>i.id===selection.ropa)||ropas[0]
 const cape=capas.find(i=>i.id===selection.capa)||capas[0]
 svg=svg.replace('<g id="legs-and-sneakers"',`<g id="cape">${cape.svg}</g><g id="legs-and-sneakers"`)
 svg=svg.replace('<g id="head"',`<g id="clothing">${clothing.svg}</g><g id="head"`)

 svg=svg.replace('<g id="head"',`<g id="backpack">${bag.svg}</g><g id="head"`)
 svg=svg.replace('<g id="jockey"',`<g id="face-accessory">${face.svg}</g><g id="jockey"`)
 return svg.replace(/<title id="title">[\s\S]*?<\/title>/,'<title id="title">Ciempi · Probador de prendas</title>')
}

paleta":"noche","textura":"estrellas"}],["Flores y arcoíris",{"cabeza":"cabeza-sol","cara":"cara-lentes-arcoiris","pies":"pies-botas","espalda":"espalda-nube","textura":"pecas"}],["Cada pie, una aventura",{"cabeza":"cabeza-audifonos","cara":"cara-lentes-fuego","pies":"pies-aleatorios","ropa":"ropa-poleron"}],["Viaje a las estrellas",{"cabeza":"cabeza-astronauta","cara":"cara-visor","espalda":"espalda-cohete","pies":"pies-espaciales","paleta":"oceano"}],["Jardín encantado",{"cabeza":"cabeza-mariposa","espalda":"espalda-nube","ropa":"ropa-falda","expresion":"guino","ojos":"verde","textura":"corazones"}],["Un cuento y una sonrisa",{"cabeza":"cabeza-gorro-lana","ropa":"ropa-poleron","pies":"pies-pantuflas","expresion":"feliz","boca":"risa"}]];
/* Se incorpora al HTML autónomo junto al catálogo y compositor compartidos. */
const selection={...defaults};let category='cabeza'
const preview=document.querySelector('#personaje')
function render(){
 preview.innerHTML=compose(base,selection)
 document.querySelectorAll('[data-item]').forEach(b=>b.setAttribute('aria-pressed',selection[b.dataset.category]===b.dataset.item?'true':'false'))
 document.querySelector('#descripcion').textContent=groups.map(([key,,items])=>items.find(i=>i.id===selection[key])?.nombre).filter(Boolean).join(' · ')
 document.querySelector('#mezclar').hidden=selection.pies!=='pies-aleatorios'
}
function showCategory(key){
 category=key
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===key?'true':'false'))
 const [,title,items]=groups.find(g=>g[0]===key)
 document.querySelector('#titulo-categoria').textContent=title
 document.querySelector('#cantidad').textContent=items.length+' opciones · puedes combinarlas con las otras categorías'
 const row=document.querySelector('#opciones');row.replaceChildren()
 for(const item of items){
  const b=document.createElement('button');b.type='button';b.className='option';b.dataset.item=item.id;b.dataset.category=key
  let thumb=compose(base,{...selection,[key]:item.id})
  const crop=['cara','ojos','boca','expresion'].includes(key)?'595 245 295 240':key==='cabeza'?'550 50 365 455':key==='pies'&&item.id!=='pies-aleatorios'?'120 450 130 145':null
  if(crop)thumb=thumb.replace('viewBox="0 0 1000 650"',`viewBox="${crop}"`)
  const img=document.createElement('img');img.alt='';img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(thumb);b.append(img)
  const label=document.createElement('span');label.textContent=item.nombre;b.append(label)
  b.onclick=()=>{selection[key]=item.id;if(item.random)selection.seed=(selection.seed+1)>>>0;document.querySelector('#conjuntos').value='';render()}
  row.append(b)
 }
 render()
}
for(const [key,title]of groups){const b=document.createElement('button');b.type='button';b.textContent=title;b.dataset.tab=key;b.onclick=()=>showCategory(key);document.querySelector('#categorias').append(b)}
for(const [i,[name]]of looks.entries()){const opt=document.createElement('option');opt.value=String(i);opt.textContent=name;document.querySelector('#conjuntos').append(opt)}
document.querySelector('#conjuntos').onchange=e=>{if(e.target.value==='')return;Object.assign(selection,defaults,looks[Number(e.target.value)][1]);showCategory(category)}
document.querySelector('#reiniciar').onclick=()=>{Object.assign(selection,defaults);document.querySelector('#conjuntos').value='';showCategory(category)}
document.querySelector('#mezclar').onclick=()=>{selection.seed=(selection.seed+1)>>>0;render()}
showCategory(category)
</script></html>

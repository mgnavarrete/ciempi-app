# Sitio de Ciempi para Nginx. Copiar a /etc/nginx/sites-available/ciempi.minttu.cl
# y luego activar HTTPS con certbot (ver docs/despliegue.md).
server {
    listen 80;
    server_name ciempi.minttu.cl;

    root /var/www/ciempi-app/dist;
    index index.html;

    # Un libro en PDF llega ya convertido a texto (el servidor acepta hasta 8 MB).
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La app siempre fresca, para que las actualizaciones lleguen.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Archivos con hash en el nombre: se pueden guardar mucho tiempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
